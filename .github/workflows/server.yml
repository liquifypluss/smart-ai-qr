name: Verify public API

on:
  pull_request:
    paths:
      - 'server/**'
      - 'database/**'
      - 'src/config/business.ts'
      - 'src/review/phrases.ts'
      - '.github/workflows/server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_ai_qr_test
          POSTGRES_USER: smartqr_test
          POSTGRES_PASSWORD: smartqr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartqr_test -d smart_ai_qr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://smartqr_test:smartqr_test@localhost:5432/smart_ai_qr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --prefix database --no-audit --no-fund
      - run: npm ci --prefix server --no-audit --no-fund
      - run: npm run typecheck --prefix server
      - run: npm test --prefix server
      - run: npm run build --prefix server
      - run: docker build --file server/Dockerfile --tag smart-ai-qr-api:test .
      - name: Smoke test container startup
        run: |
          docker run --detach --name smart-ai-qr-api-smoke --read-only \
            -p 127.0.0.1:13000:3000 \
            -e DATABASE_URL=postgresql://test:test@127.0.0.1:1/disposable_test \
            -e PUBLIC_API_ORIGIN=https://api.smartqr.liquifyplus.in \
            -e CORS_ORIGINS=https://smartqr.liquifyplus.in \
            smart-ai-qr-api:test
          trap 'docker rm -f smart-ai-qr-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:13000/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs smart-ai-qr-api-smoke
          exit 1
      - run: npm test --prefix database
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:staging
