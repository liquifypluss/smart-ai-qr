name: Verify database foundation

on:
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/database.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_ai_qr_test
          POSTGRES_USER: smartqr_test
          POSTGRES_PASSWORD: smartqr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartqr_test -d smart_ai_qr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://smartqr_test:smartqr_test@localhost:5432/smart_ai_qr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --prefix database --no-audit --no-fund
      - run: npm run typecheck --prefix database
      - run: npm test --prefix database
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:staging
