name: Verify Super Admin design foundation
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/ui-ux-pro-max/**'
      - 'docs/admin/**'
      - 'design-system/aibawaal-super-admin/**'
      - '.github/workflows/admin-design-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official skill and design research
        run: |
          test -f AGENTS.md
          test -s .agents/skills/ui-ux-pro-max/SKILL.md
          test -f .agents/skills/ui-ux-pro-max/scripts/search.py
          test -s design-system/aibawaal-super-admin/PROPOSAL.md
          test -s docs/admin/PAGE-SPEC.md
          for file in docs/admin/design-research/*.md; do test -s "$file"; done
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "admin dashboard" --stack react >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          p = Path('design-system/aibawaal-super-admin/MASTER.md')
          if p.exists():
              raise SystemExit('Approval gate: MASTER.md must not be committed until direction is approved')
          print('Design foundation and approval gate verified')
          PY
